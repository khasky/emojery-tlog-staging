name: Verify

# Runs emojery-verifier against log-staging.emojery.app every 30 minutes (the quick check)
# and once a night (--full), and commits what the shared history needs: new anchors at any
# verdict, the providers' new keys, index.json after a PASS, and one verdict line.
#
# Two jobs, so the token that can write to this repository never runs the verifier: `check`
# reads only and hands its changes over as an artifact; `commit` applies them.
#
# The verifier is checked out at a pinned commit. Moving the pin is a change to this file.

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Replay the whole log (--full)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

env:
  LOG_NAME: log-staging.emojery.app
  API: https://api-staging.emojery.app
  VERIFIER_COMMIT: 3a82dd09558b685727f8eff38bf16794485d6382

jobs:
  check:
    name: Check the log
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      skip: ${{ steps.status.outputs.skip }}
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: mirror
          persist-credentials: false

      # Under the red button the operator is restoring something: no verdict, no commit.
      - name: Read /status
        id: status
        run: |
          body=$(curl -fsS --max-time 20 "$API/status" || true)
          if printf '%s' "$body" | jq -e '.maintenance == true' >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "maintenance: skipping this run"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.status.outputs.skip != 'true'
        with:
          repository: khasky/emojery-verifier
          ref: ${{ env.VERIFIER_COMMIT }}
          path: verifier
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.status.outputs.skip != 'true'
        with:
          package_json_file: verifier/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.status.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Install the verifier
        if: steps.status.outputs.skip != 'true'
        working-directory: verifier
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The verifier's state (the pinned anchored checkpoint) lives in the Actions cache; an
      # evicted cache only means the next run pins afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.status.outputs.skip != 'true'
        with:
          path: ${{ runner.temp }}/state
          key: verifier-state-${{ github.run_id }}
          restore-keys: verifier-state-

      - name: Run the verifier
        id: run
        if: steps.status.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          full=""
          if [ "${{ github.event.schedule }}" = "23 2 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then full="--full"; fi
          set +e
          node verifier/packages/verifier/src/cli.js --log "$LOG_NAME" --state "$RUNNER_TEMP/state/state.json" $full \
            --update-mirror mirror --message-file "$RUNNER_TEMP/message.txt"
          code=$?
          set -e
          case "$code" in
            0) echo "verdict=PASS" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=FAIL" >> "$GITHUB_OUTPUT" ;;
            3) echo "verdict=WAIT" >> "$GITHUB_OUTPUT" ;;
            *) echo "the verifier could not run (exit $code)"; exit "$code" ;;
          esac

      - name: Collect the changes
        if: steps.status.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd mirror
          git add -A
          git diff --cached --name-only > "$RUNNER_TEMP/out/files.txt"
          tar -cf "$RUNNER_TEMP/out/changes.tar" -T "$RUNNER_TEMP/out/files.txt"
          cp "$RUNNER_TEMP/message.txt" "$RUNNER_TEMP/out/message.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.status.outputs.skip != 'true'
        with:
          name: changes
          path: ${{ runner.temp }}/out/
          retention-days: 3

  commit:
    name: Commit the run
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/in

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            tar -xf "$RUNNER_TEMP/in/changes.tar"
            git add -A
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit --quiet -F "$RUNNER_TEMP/in/message.txt"
            if git push --quiet origin HEAD:main; then exit 0; fi
            git reset --quiet --soft HEAD~1
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts"; exit 1

      - name: Tell Discord about a FAIL
        if: needs.check.outputs.verdict == 'FAIL'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "emojery-tlog-staging: verifier FAIL - $(cat "$RUNNER_TEMP/in/message.txt")" '{content: $c}' |
            curl -fsS -H 'content-type: application/json' -d @- "$WEBHOOK" >/dev/null

      - name: Ping healthchecks.io
        if: always()
        env:
          PING: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          [ -n "$PING" ] || exit 0
          suffix=""
          [ "${{ job.status }}" = "success" ] || suffix="/fail"
          curl -fsS --max-time 10 "$PING$suffix" >/dev/null || true
